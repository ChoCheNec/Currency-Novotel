<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курс EUR/UAH НБУ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; 
            color: #474747;
            font-family: 'Arial', sans-serif;
            font-size: 40px; 
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="rate">...</div>

    <script>
        function fetchRate() {
            var xhr = new XMLHttpRequest();
            // Добавляем текущее время в конец URL (&_=12345...), 
            // чтобы телевизор думал, что это новый адрес, и не брал данные из кэша
            var url = 'https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=EUR&json&_=' + new Date().getTime();
            
            xhr.open('GET', url, true);
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            if (data && data.length > 0) {
                                var rate = data[0].rate.toFixed(2);
                                document.getElementById('rate').innerText = '1 € = ' + rate + ' ₴';
                            }
                        } catch (error) {
                            console.error('Помилка парсингу:', error);
                            document.getElementById('rate').innerText = 'Помилка даних';
                        }
                    } else {
                        // Ваша пасхалка сохранена :)
                        console.error('Знов щось натикали... краще дзвоніть Петі', xhr.statusText);
                    }
                }
            };
            
            // В телевизорах иногда нужно явно указывать таймаут
            xhr.timeout = 10000; 
            xhr.ontimeout = function () {
                console.error('Таймаут. Дзвоніть Петі.');
            };

            xhr.send();
        }

        // Запуск при загрузке
        fetchRate();
        
        // Обновление каждый час (3600000 мс)
        setInterval(fetchRate, 3600000);
    </script>
</body>
</html>
