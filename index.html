<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курс EUR/UAH НБУ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; 

            color: #474747;
            font-family: 'Arial', sans-serif;
            font-size: 30px; 
            font-weight: bold;
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="rate">...</div>

    <script>
        async function fetchRate() {
            try {
                const response = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=EUR&json');
                const data = await response.json();
                
                if (data && data.length > 0) {
                    const rate = data[0].rate.toFixed(2);
                    document.getElementById('rate').innerText = '1 € = ' + rate + ' ₴';
                }
            } catch (error) {
                console.error('Помилка загрузки:', error);
            }
        }

        fetchRate();
        
        setInterval(fetchRate, 3600000);
    </script>
</body>
</html>
