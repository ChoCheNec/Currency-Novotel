<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            /* Прозрачный фон для наложения в VXT Canvas */
            background: transparent; 
            color: #ffffff; /* Цвет текста. Измените на #000000, если фон светлый */
            font-family: 'SamsungOne', 'Segoe UI', Arial, sans-serif;
            font-size: 72px; /* Размер шрифта */
            font-weight: bold;
            margin: 0;
            display: flex;
            align-items: center; /* Выравнивание виджета */
            justify-content: center; 
            height: 100vh;
        }
        #exchange-rate {
            /* Легкая тень для контраста поверх картинок */
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6); 
        }
    </style>
</head>
<body>
    <!-- Текст-заглушка, пока данные грузятся -->
    <div id="exchange-rate">1 € = ... ₴</div>

    <script>
        async function fetchExchangeRate() {
            try {
                // Запрос к API НБУ для Евро
                const response = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=EUR&json');
                const data = await response.json();
                const rate = data[0].rate;

                // Округление до 2 знаков после запятой (например, 41.56)
                const formattedRate = rate.toFixed(2);

                // Вывод на экран с символами
                document.getElementById('exchange-rate').innerText = `1 € = ${formattedRate} ₴`;
            } catch (error) {
                console.error('Ошибка загрузки курса НБУ:', error);
            }
        }

        // Запуск сразу при включении панели
        fetchExchangeRate();
        
        // Автоматическое обновление данных каждый час (3 600 000 миллисекунд)
        setInterval(fetchExchangeRate, 3600000);
    </script>
</body>
</html>
