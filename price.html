<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal UAH Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; 
            font-family: 'Arial', sans-serif;
            color: #999999; 
            
            /* Делаем размер динамическим: 65% от высоты виджета */
            font-size: 65vh; 
            line-height: 1; /* Убираем лишние отступы */
            
            display: flex;
            justify-content: flex-end; 
            /* Выравниваем текст строго по центру виджета по вертикали */
            align-items: center; 
            
            height: 100vh;
            overflow: hidden;
        }
        #result {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="result"></div>

    <script>
        async function fetchAndCalculate() {
            try {
                const params = new URLSearchParams(window.location.search);
                const eurParam = params.get('eur');
                
                if (!eurParam) return;
                
                const eur = parseFloat(eurParam);

                const response = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=EUR&json');
                const data = await response.json();
                
                if (data && data.length > 0) {
                    const rate = data[0].rate;
                    
                    let exactUah = (eur * rate).toFixed(2);
                    
                    let parts = exactUah.toString().split('.');
                    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
                    let formattedUah = '*' + parts.join(',') + ' ₴';
                    
                    document.getElementById('result').innerText = formattedUah;
                }
            } catch (error) {
                console.error('Ошибка загрузки курса:', error);
            }
        }

        fetchAndCalculate();
        setInterval(fetchAndCalculate, 3600000);
    </script>
</body>
</html>
