<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор вартості</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: transparent; 
        }
        .calculator {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 24px;
        }
        input {
            font-size: 28px;
            padding: 15px;
            width: 80%;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 25px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #0F204C;
        }
        .result {
            font-size: 38px;
            font-weight: bold;
            color: #0F204C;
        }
        .rate-info {
            font-size: 14px;
            color: #888;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>Введіть суму в Євро</h2>
        
        <input type="number" id="eurInput" placeholder="€ 0.00" min="0">
        
        <div class="result" id="uahResult">0,00 ₴</div>
        
        <div class="rate-info" id="rateInfo">Завантаження курсу НБУ...</div>
    </div>

    <script>
        let currentRate = 0;

        async function fetchRate() {
            try {
                const response = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=EUR&json');
                const data = await response.json();
                
                if (data && data.length > 0) {
                    currentRate = data[0].rate;
                    document.getElementById('rateInfo').innerText = `Офіційний курс НБУ: 1 € = ${currentRate.toFixed(2)} ₴`;
                    calculate(); 
                }
            } catch (error) {
                console.error('Помилка завантаження:', error);
                document.getElementById('rateInfo').innerText = 'Помилка з\'єднання з НБУ';
            }
        }

        function calculate() {
            const eurValue = parseFloat(document.getElementById('eurInput').value);
            const resultDiv = document.getElementById('uahResult');
            
            if (isNaN(eurValue) || eurValue <= 0) {
                resultDiv.innerText = '0,00 ₴';
                return;
            }

            const exactUah = (eurValue * currentRate).toFixed(2);
            let parts = exactUah.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            resultDiv.innerText = parts.join(',') + ' ₴';
        }

        document.getElementById('eurInput').addEventListener('input', calculate);

        fetchRate();
        
        setInterval(fetchRate, 3600000);
    </script>
</body>
</html>
